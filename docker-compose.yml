name: andes

services:
  postgres:
    image: postgres:18.7
    container_name: andes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BD_NOMBRE:-andes}
      POSTGRES_USER: andes_propietario
      POSTGRES_PASSWORD: ${BD_PROPIETARIO_CLAVE:?Define BD_PROPIETARIO_CLAVE en el archivo .env}
      ANDES_APP_CLAVE: ${BD_APP_CLAVE:?Define BD_APP_CLAVE en el archivo .env}
      ANDES_LECTOR_CLAVE: ${BD_LECTOR_CLAVE:?Define BD_LECTOR_CLAVE en el archivo .env}
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - '127.0.0.1:${BD_PUERTO:-5433}:5432'
    volumes:
      - datos-postgres:/var/lib/postgresql
      - ./database/docker:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username andes_propietario --dbname "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  datos-postgres:
